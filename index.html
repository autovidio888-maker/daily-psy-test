<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日限定心理測驗 | DayDayQuiz</title>

  <!-- Google AdSense 廣告代碼 -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3822526422033370"
       crossorigin="anonymous"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 截圖套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }
    .animate-float {
      animation: floatSlow 3.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden p-6 relative">
    
    <!-- 1. 載入中畫面 -->
    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-9 w-9 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="mt-4 text-gray-500 font-medium tracking-wide">正在取得今日最新測驗...</p>
    </div>

    <!-- 2. 開始頁面 -->
    <div id="start-screen" class="hidden text-center py-6">
      <div class="inline-flex items-center gap-1.5 bg-indigo-50 text-indigo-600 text-xs px-3.5 py-1 rounded-full font-bold border border-indigo-100/80">
        <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-ping"></span>
        今日限定
      </div>
      <h1 id="quiz-title" class="text-2xl font-black mt-4 mb-3 text-slate-900 leading-snug"></h1>
      <p class="text-gray-500 text-sm mb-8">只需 1 分鐘，測出你的專屬命定角色與深層性格！</p>
      
      <!-- 頂部廣告展示位 -->
      <div class="w-full py-3 bg-gray-50 border border-dashed border-gray-300 rounded-xl text-xs text-gray-400 mb-6">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3822526422033370"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>

      <button onclick="startQuiz()" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-extrabold rounded-2xl shadow-lg shadow-indigo-200 transition active:scale-95 text-base tracking-wide">
        開始測驗 ✨
      </button>
    </div>

    <!-- 3. 測驗問答頁面 -->
    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center text-xs font-bold text-gray-400 mb-3 tracking-wider">
        <span>QUESTION</span>
        <span id="progress-text">1 / 6</span>
      </div>
      <div class="w-full bg-gray-100 h-2 rounded-full mb-6 overflow-hidden">
        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-600 h-2 rounded-full transition-all duration-300" style="width: 16%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-bold text-slate-800 mb-6 leading-relaxed"></h2>

      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- 答題頁底部廣告展示區 -->
      <div class="w-full py-2 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-center text-[10px] text-gray-400">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3822526422033370"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>

    <!-- 4. 計算過場動畫 -->
    <div id="analyzing-screen" class="hidden text-center py-10">
      <div class="flex flex-col items-center">
        <div class="rounded-full bg-gradient-to-tr from-indigo-100 to-purple-100 p-5 mb-4 shadow-inner">
          <svg class="w-9 h-9 text-indigo-600 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-extrabold text-slate-800 mb-1">正在剖析你的靈魂屬性...</h3>
        <p class="text-xs text-gray-400 mb-6">比對人格模型中，即將揭曉你的專屬角色</p>
      </div>
      <!-- 過場廣告位 -->
      <div class="w-full py-5 bg-gray-50 border border-dashed border-gray-300 rounded-xl text-xs text-gray-400">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-3822526422033370"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>

    <!-- 5. 結果頁面（包含巴納姆效應深度解析與超萌卡片） -->
    <div id="result-screen" class="hidden">
      <!-- 截圖範圍 -->
      <div id="capture-area" class="relative overflow-hidden bg-gradient-to-br from-indigo-50/90 via-purple-50/60 to-pink-50/90 p-6 rounded-2xl border border-indigo-100/90 shadow-sm mb-6">
        
        <!-- 背景可愛漸層光斑 -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-purple-200/50 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-pink-200/50 rounded-full blur-2xl pointer-events-none"></div>

        <!-- 頂部：今日專屬吉祥物圖鑑 -->
        <div class="flex flex-col items-center text-center mb-4 relative z-10">
          
          <div class="relative mb-3 animate-float">
            <div id="avatar-glow" class="absolute -inset-1 rounded-full blur-md opacity-60"></div>
            <div id="avatar-container" class="relative w-24 h-24 rounded-full bg-white shadow-md border-2 border-white flex items-center justify-center overflow-hidden">
              <div id="avatar-svg-slot" class="w-full h-full flex items-center justify-center"></div>
              <span id="avatar-emoji" class="absolute bottom-1 right-1 text-base bg-white/95 rounded-full p-0.5 shadow-xs leading-none"></span>
            </div>
          </div>

          <span id="result-tagline" class="text-[11px] font-extrabold tracking-widest text-indigo-600 uppercase bg-white/90 px-3 py-0.5 rounded-full border border-indigo-100 shadow-xs mb-1.5"></span>
          <h2 id="result-title" class="text-2xl font-black text-slate-900 tracking-tight"></h2>
          <p id="result-quote" class="text-xs text-slate-500 italic mt-1 max-w-[290px] leading-relaxed"></p>
        </div>

        <!-- 巴納姆效應：深層性格剖析區塊 -->
        <div class="bg-white/95 backdrop-blur-sm rounded-2xl p-4 mb-3.5 shadow-xs border border-purple-100/60 relative z-10">
          <div class="text-[11px] font-bold text-indigo-600 mb-1.5 flex items-center gap-1">
            <span>🔮</span> 靈魂深層剖析
          </div>
          <p id="result-analysis" class="text-xs text-slate-600 leading-relaxed text-justify tracking-wide"></p>
        </div>
        
        <!-- 人格特質標籤 -->
        <div class="bg-white/90 backdrop-blur-sm rounded-xl p-3 mb-3 shadow-xs border border-white/80 relative z-10">
          <div class="text-[11px] font-bold text-gray-400 mb-2 flex items-center gap-1">
            <span>✨</span> 核心特質標籤
          </div>
          <div id="result-traits" class="flex flex-wrap gap-1.5"></div>
        </div>

        <!-- 契合搭檔卡片 -->
        <div class="grid grid-cols-2 gap-2 text-xs relative z-10">
          <div class="bg-white/90 p-3 rounded-xl border border-emerald-100/80 shadow-xs flex flex-col justify-between">
            <span class="font-bold text-emerald-600 block mb-1 text-[11px]">命定拍檔 💖</span>
            <span id="best-match" class="font-bold text-slate-700 text-xs truncate"></span>
          </div>
          <div class="bg-white/90 p-3 rounded-xl border border-rose-100/80 shadow-xs flex flex-col justify-between">
            <span class="font-bold text-rose-500 block mb-1 text-[11px]">相剋雷區 ⚡</span>
            <span id="worst-match" class="font-bold text-slate-700 text-xs truncate"></span>
          </div>
        </div>

        <!-- 頁尾品牌與浮水印 -->
        <div class="mt-4 pt-3 border-t border-indigo-100/60 flex justify-between items-center text-[10px] text-gray-400 relative z-10">
          <span class="font-bold text-indigo-500 tracking-wide">🐾 daydayquiz.com</span>
          <span>今日限定 · 截圖分享</span>
        </div>
      </div>

      <!-- 分享按鈕與重新測驗 -->
      <div class="space-y-2.5">
        <button onclick="saveResultImage()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:opacity-95 text-white font-extrabold rounded-2xl shadow-lg shadow-purple-200 transition active:scale-[0.98] flex items-center justify-center gap-2 text-sm">
          <span>📸</span> 儲存精緻卡片發 Threads / IG
        </button>
        <button onclick="resetQuiz()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-semibold rounded-xl transition">
          重新測驗
        </button>
      </div>
    </div>

  </div>

  <!-- 頁尾合規宣告（Google AdSense 審核必備） -->
  <footer class="mt-8 text-center text-xs text-gray-400 space-y-2 pb-6">
    <div>
      <a href="#privacy" onclick="alert('【隱私權政策】\n本站尊重並保護您的隱私，測驗過程完全在前端執行，不收集任何個人識別資訊。第三方廣告夥伴（如 Google AdSense）可能會使用 Cookie 來提供個人化廣告服務。'); return false;" class="underline hover:text-gray-600">隱私權政策</a>
      <span class="mx-2">|</span>
      <a href="#about" onclick="alert('【關於本站】\nDayDayQuiz（daydayquiz.com）提供每日自動更新之趣味心理測驗與社群互動內容，所有題目與分析結果僅供日常娛樂交流使用。'); return false;" class="underline hover:text-gray-600">關於我們</a>
    </div>
    <p>© 2026 DayDayQuiz. All rights reserved.</p>
  </footer>

  <script>
    let quizData = null;
    let currentStep = 0;
    let userAnswers = [];

    async function init() {
      try {
        const res = await fetch(`public/data/daily_quiz.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("尚未生成題目");
        quizData = await res.json();

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("quiz-title").innerText = quizData.theme;
        document.getElementById("start-screen").classList.remove("hidden");
      } catch (err) {
        document.getElementById("loading").innerHTML = `
          <p class="text-rose-500 font-bold">題目加載失敗</p>
          <p class="text-xs text-gray-400 mt-1">請確認 Actions 已成功執行過一次</p>
        `;
      }
    }

    function startQuiz() {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      currentStep = 0;
      userAnswers = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizData.questions[currentStep];
      const total = quizData.questions.length;

      document.getElementById("progress-text").innerText = `${currentStep + 1} / ${total}`;
      document.getElementById("progress-bar").style.width = `${((currentStep + 1) / total) * 100}%`;
      document.getElementById("question-text").innerText = q.title;

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-2xl border border-gray-200/90 bg-white hover:border-indigo-500 hover:bg-indigo-50/40 transition duration-150 text-sm font-medium text-slate-700 active:scale-[0.99] shadow-2xs";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });
    }

    function selectOption(type) {
      userAnswers.push(type);
      if (currentStep < quizData.questions.length - 1) {
        currentStep++;
        renderQuestion();
      } else {
        showAnalyzing();
      }
    }

    function showAnalyzing() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("analyzing-screen").classList.remove("hidden");

      setTimeout(() => {
        document.getElementById("analyzing-screen").classList.add("hidden");
        showResult();
      }, 2200);
    }

    function showResult() {
      document.getElementById("result-screen").classList.remove("hidden");

      const counts = {};
      userAnswers.forEach(t => counts[t] = (counts[t] || 0) + 1);
      let winner = 'A';
      let maxCount = -1;
      for (const [k, v] of Object.entries(counts)) {
        if (v > maxCount) {
          maxCount = v;
          winner = k;
        }
      }

      const res = quizData.results[winner];

      // 1. 生成超萌彩色大頭像 (thumbs 風格，粉嫩背景與大眼微笑)
      const seed = encodeURIComponent(res.avatar_seed || res.title || winner);
      const avatarUrl = `https://api.dicebear.com/7.x/thumbs/svg?seed=${seed}&size=128&shapeColor=ffd5dc,d1e8e2,dbeafe,fef3c7,f3e8ff&backgroundColor=transparent`;

      const svgSlot = document.getElementById("avatar-svg-slot");
      svgSlot.innerHTML = `<img src="${avatarUrl}" alt="avatar" class="w-full h-full object-cover scale-110" crossOrigin="anonymous" />`;

      document.getElementById("avatar-emoji").innerText = res.emoji || '🐾';
      
      const glowElem = document.getElementById("avatar-glow");
      if (glowElem) {
        glowElem.className = `absolute -inset-1 rounded-full blur-md opacity-60 bg-gradient-to-r ${res.color || 'from-pink-400 to-indigo-400'}`;
      }

      document.getElementById("result-tagline").innerText = res.tagline || "今日專屬性格圖鑑";
      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-quote").innerText = `“${res.quote}”`;

      // 2. 巴納姆效應詳細描述（有後端 analysis 則載入，否則啟動經典巴納姆心理通用庫）
      const defaultBarnum = {
        'A': '你看似適應力極強、什麼都能泰然處之，但其實內心對安全感有很高的要求。你往往把堅強與靠譜留給外人，甚至習慣一個人扛下所有瑣碎，但偶爾你也很渴望能有一個人一眼看穿你的逞強，允許你毫無負擔地徹底放空。',
        'B': '你常常給人隨和、脾氣好、不拘小節的印象，但只有真正走進你心裡的人才知道，你對特定的價值觀有著不可妥協的底線。你很擅長察覺旁人的情緒轉折，卻總把自己的疲憊與焦慮悄悄藏起來自己消化。',
        'C': '外表看似理性冷靜、凡事井井有條的你，內心其實藏著極其豐富且敏感的情感世界。你很需要專屬的個人邊界來充電，當周遭喧囂過盛時，安靜的獨處對你而言不是孤獨，而是靈魂唯一的解藥。',
        'D': '你是個充滿創造力與熱情的人，總能給身邊的人帶來意想不到的驚喜。但你偶爾會陷入深深的自我懷疑，在「渴望展現自己」與「想徹底隱形消失」之間反覆拉扯，其實你遠比自己想像中的還要耀眼迷人。'
      };
      document.getElementById("result-analysis").innerText = res.analysis || defaultBarnum[winner] || defaultBarnum['A'];

      // 3. 解析命定與相剋名稱為純中文稱號
      function getDisplayName(matchVal) {
        if (!matchVal) return "全員契合";
        let str = String(matchVal).trim();
        if (quizData.results && quizData.results[str] && quizData.results[str].title) {
          str = quizData.results[str].title;
        }
        return str.split("：")[0].split(":")[0].trim();
      }

      document.getElementById("best-match").innerText = getDisplayName(res.bestMatch);
      document.getElementById("worst-match").innerText = getDisplayName(res.worstMatch);

      // 特質標籤渲染
      const traitsBox = document.getElementById("result-traits");
      traitsBox.innerHTML = "";
      res.traits.forEach(t => {
        const badge = document.createElement("span");
        badge.className = "px-3 py-1 bg-white border border-purple-100 rounded-lg text-xs font-semibold text-slate-700 shadow-2xs";
        badge.innerText = `#${t}`;
        traitsBox.appendChild(badge);
      });
    }

    function saveResultImage() {
      const area = document.getElementById("capture-area");
      html2canvas(area, { 
        scale: 3, 
        useCORS: true,
        backgroundColor: null 
      }).then(canvas => {
        const link = document.createElement("a");
        link.download = `DayDayQuiz_${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    function resetQuiz() {
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("start-screen").classList.remove("hidden");
    }

    init();
  </script>
</body>
</html>
