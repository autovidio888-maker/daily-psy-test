<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日限定心理測驗</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 截圖套件 用於將結果卡片轉為圖片下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

  <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden p-6 relative">
    
    <!-- 1. 載入中畫面 -->
    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
      <p class="mt-4 text-gray-500 font-medium">正在取得今日最新測驗...</p>
    </div>

    <!-- 2. 開始頁面 -->
    <div id="start-screen" class="hidden text-center py-6">
      <span class="bg-indigo-100 text-indigo-700 text-xs px-3 py-1 rounded-full font-semibold">今日限定</span>
      <h1 id="quiz-title" class="text-2xl font-black mt-4 mb-3 text-slate-900 leading-snug"></h1>
      <p class="text-gray-500 text-sm mb-8">只需 1 分鐘，測出你的今日隱藏屬性！</p>
      
      <!-- 頂部預留廣告位 -->
      <div class="w-full py-3 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-xs text-gray-400 mb-6">
        [ 廣告版位預留 ]
      </div>

      <button onclick="startQuiz()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition active:scale-95">
        開始測驗
      </button>
    </div>

    <!-- 3. 測驗問答頁面 -->
    <div id="quiz-screen" class="hidden">
      <div class="flex justify-between items-center text-xs font-semibold text-gray-400 mb-4">
        <span>PROGRESS</span>
        <span id="progress-text">1 / 6</span>
      </div>
      <div class="w-full bg-gray-200 h-1.5 rounded-full mb-6">
        <div id="progress-bar" class="bg-indigo-600 h-1.5 rounded-full transition-all duration-300" style="width: 16%"></div>
      </div>

      <h2 id="question-text" class="text-lg font-bold text-slate-800 mb-6 leading-relaxed"></h2>

      <div id="options-container" class="space-y-3 mb-6"></div>

      <!-- 答題頁底部預留廣告位 -->
      <div class="w-full py-2 bg-gray-50 border border-dashed border-gray-300 rounded text-center text-[10px] text-gray-400">
        [ 廣告展示區 ]
      </div>
    </div>

    <!-- 4. 計算過場動畫（展示廣告黃金期） -->
    <div id="analyzing-screen" class="hidden text-center py-10">
      <div class="animate-pulse flex flex-col items-center">
        <div class="rounded-full bg-indigo-100 p-4 mb-4">
          <svg class="w-8 h-8 text-indigo-600 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-2">正在分析你的隱性特質...</h3>
        <p class="text-xs text-gray-400 mb-6">比對演算法數據中</p>
      </div>
      <!-- 過場廣告位 -->
      <div class="w-full py-8 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-xs text-gray-400">
        [ 廣告版位：此處曝光率最高 ]
      </div>
    </div>

    <!-- 5. 結果頁面 -->
    <div id="result-screen" class="hidden">
      <!-- 截圖範圍 (包含標題、特徵與浮水印) -->
      <div id="capture-area" class="bg-gradient-to-br from-indigo-50 to-purple-50 p-6 rounded-xl border border-indigo-100 mb-6">
        <span class="text-xs text-indigo-500 font-bold tracking-wider">測驗結果分析</span>
        <h2 id="result-title" class="text-2xl font-black text-slate-900 mt-1 mb-2"></h2>
        <p id="result-quote" class="text-sm italic text-gray-600 mb-4 border-l-2 border-indigo-500 pl-3"></p>
        
        <div class="bg-white/80 backdrop-blur rounded-lg p-3 mb-4">
          <div class="text-xs font-bold text-gray-400 mb-2">人格特質標籤</div>
          <div id="result-traits" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-emerald-50 text-emerald-700 p-2.5 rounded-lg border border-emerald-100">
            <span class="font-bold block mb-0.5">最佳拍檔 ✨</span>
            <span id="best-match"></span>
          </div>
          <div class="bg-rose-50 text-rose-700 p-2.5 rounded-lg border border-rose-100">
            <span class="font-bold block mb-0.5">命中剋星 ⚡</span>
            <span id="worst-match"></span>
          </div>
        </div>

        <div class="mt-4 pt-3 border-t border-gray-200 flex justify-between items-center text-[10px] text-gray-400">
          <span>今日心理測驗 Daily Quiz</span>
          <span>分享你的測驗結果</span>
        </div>
      </div>

      <!-- 分享按鈕與重新測驗 -->
      <div class="space-y-2">
        <button onclick="saveResultImage()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow transition active:scale-95 flex items-center justify-center gap-2">
          儲存測驗卡片發 Threads / IG
        </button>
        <button onclick="resetQuiz()" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-600 text-sm font-semibold rounded-xl transition">
          重新測驗
        </button>
      </div>
    </div>

  </div>

  <script>
    let quizData = null;
    let currentStep = 0;
    let userAnswers = [];

    // 初始化載入今日 JSON
    async function init() {
      try {
        const res = await fetch(`public/data/daily_quiz.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("尚未生成題目");
        quizData = await res.json();

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("quiz-title").innerText = quizData.theme;
        document.getElementById("start-screen").classList.remove("hidden");
      } catch (err) {
        document.getElementById("loading").innerHTML = `
          <p class="text-rose-500 font-bold">題目加載失敗</p>
          <p class="text-xs text-gray-400 mt-1">請確認 Actions 已成功執行過一次</p>
        `;
      }
    }

    function startQuiz() {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.remove("hidden");
      currentStep = 0;
      userAnswers = [];
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizData.questions[currentStep];
      const total = quizData.questions.length;

      document.getElementById("progress-text").innerText = `${currentStep + 1} / ${total}`;
      document.getElementById("progress-bar").style.width = `${((currentStep + 1) / total) * 100}%`;
      document.getElementById("question-text").innerText = q.title;

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      q.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-3.5 rounded-xl border border-gray-200 hover:border-indigo-600 hover:bg-indigo-50/50 transition duration-150 text-sm font-medium text-slate-700 active:scale-[0.99]";
        btn.innerText = opt.text;
        btn.onclick = () => selectOption(opt.type);
        container.appendChild(btn);
      });
    }

    function selectOption(type) {
      userAnswers.push(type);
      if (currentStep < quizData.questions.length - 1) {
        currentStep++;
        renderQuestion();
      } else {
        showAnalyzing();
      }
    }

    function showAnalyzing() {
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("analyzing-screen").classList.remove("hidden");

      // 模擬 2.5 秒分析動畫（讓使用者停留觀看廣告）
      setTimeout(() => {
        document.getElementById("analyzing-screen").classList.add("hidden");
        showResult();
      }, 2500);
    }

    function showResult() {
      document.getElementById("result-screen").classList.remove("hidden");

      // 計算出現次數最多的人格類別
      const counts = {};
      userAnswers.forEach(t => counts[t] = (counts[t] || 0) + 1);
      let winner = 'A';
      let maxCount = -1;
      for (const [k, v] of Object.entries(counts)) {
        if (v > maxCount) {
          maxCount = v;
          winner = k;
        }
      }

      const res = quizData.results[winner];
      document.getElementById("result-title").innerText = res.title;
      document.getElementById("result-quote").innerText = `“${res.quote}”`;
      document.getElementById("best-match").innerText = res.bestMatch || "全員契合";
      document.getElementById("worst-match").innerText = res.worstMatch || "無";

      const traitsBox = document.getElementById("result-traits");
      traitsBox.innerHTML = "";
      res.traits.forEach(t => {
        const badge = document.createElement("span");
        badge.className = "px-2.5 py-1 bg-white border border-gray-200 rounded-md text-xs font-semibold text-slate-700";
        badge.innerText = `#${t}`;
        traitsBox.appendChild(badge);
      });
    }

    // 截圖儲存成手機相片
    function saveResultImage() {
      const area = document.getElementById("capture-area");
      html2canvas(area, { scale: 2 }).then(canvas => {
        const link = document.createElement("a");
        link.download = `今日測驗結果_${new Date().toLocaleDateString()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    function resetQuiz() {
      document.getElementById("result-screen").classList.add("hidden");
      document.getElementById("start-screen").classList.remove("hidden");
    }

    init();
  </script>
</body>
</html>
