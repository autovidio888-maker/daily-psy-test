<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>即時報價 K 線｜裸 K 訓練場</title>
  <meta name="description" content="即時報價 K 線、日 K、週 K、月 K、技術指標與畫線工具。僅供 K 線閱讀練習與教育用途，不構成投資建議。" />

  <!-- AdSense 驗證，沿用你的 publisher ID -->
  <meta name="google-adsense-account" content="ca-pub-3822526422033370">

  <!-- Google AdSense -->
  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3822526422033370"
    crossorigin="anonymous"></script>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html, body {
      background: #020617;
      color: #e5e7eb;
    }

    .glass {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
    }

    .btn {
      border-radius: 999px;
      font-weight: 800;
      transition: 0.15s ease;
      white-space: nowrap;
    }

    .btn-active {
      background: #2563eb;
      color: white;
      border: 1px solid #2563eb;
    }

    .btn-normal {
      background: #0f172a;
      color: #cbd5e1;
      border: 1px solid #334155;
    }

    .btn-normal:hover {
      background: #1e293b;
      color: white;
    }

    .study-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      user-select: none;
    }

    .study-card input {
      transform: scale(1.1);
      margin-right: 8px;
    }

    #tv-chart-wrap {
      height: calc(100vh - 300px);
      min-height: 560px;
    }

    @media (max-width: 768px) {
      #tv-chart-wrap {
        height: 620px;
        min-height: 620px;
      }
    }
  </style>
</head>

<body class="min-h-screen">
  <main class="max-w-[1500px] mx-auto px-4 py-5">

    <!-- Header -->
    <section class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-4 mb-5">
      <div>
        <a href="index.html" class="inline-flex items-center gap-2 text-sm text-blue-300 hover:text-blue-200 font-bold mb-3">
          ← 回裸 K 訓練場
        </a>

        <div class="inline-flex items-center px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-400/30 text-emerald-300 text-xs font-black mb-3">
          即時報價 K 線
        </div>

        <h1 class="text-3xl md:text-5xl font-black tracking-tight text-white">
          報價 K 線與技術指標
        </h1>

        <p class="text-slate-400 mt-2">
          連接外部報價圖表，可切換日 K、週 K、月 K，並加入常用技術指標與畫線工具。
        </p>
      </div>

      <div class="flex flex-wrap gap-2">
        <a href="index.html" class="btn btn-normal px-4 py-2">裸 K 練習</a>
        <button id="reload-chart" class="btn btn-active px-4 py-2">重新載入圖表</button>
      </div>
    </section>

    <!-- Controls -->
    <section class="glass rounded-3xl p-4 mb-5">
      <div class="grid grid-cols-1 xl:grid-cols-[1.2fr_1fr_1.6fr] gap-4">

        <!-- Symbol -->
        <div>
          <label class="block text-sm text-slate-400 font-bold mb-2">商品 / 股票代號</label>

          <div class="flex gap-2">
            <input
              id="symbol-input"
              value="TWSE:2330"
              class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-700 text-white font-black outline-none focus:border-blue-500"
              placeholder="例如 TWSE:2330、NASDAQ:NVDA、AMEX:SPY"
            />

            <button id="apply-symbol" class="btn btn-active px-5 py-3">
              套用
            </button>
          </div>

          <div class="flex flex-wrap gap-2 mt-3">
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="TWSE:2330">台積電</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="TWSE:2317">鴻海</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="TWSE:2454">聯發科</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="NASDAQ:NVDA">NVDA</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="NASDAQ:AAPL">AAPL</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="AMEX:SPY">SPY</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="NASDAQ:QQQ">QQQ</button>
            <button class="symbol-btn btn btn-normal px-3 py-2 text-sm" data-symbol="BINANCE:BTCUSDT">BTC</button>
          </div>
        </div>

        <!-- Timeframe -->
        <div>
          <label class="block text-sm text-slate-400 font-bold mb-2">K 線週期</label>

          <div class="grid grid-cols-3 gap-2">
            <button class="interval-btn btn btn-active px-4 py-3" data-interval="D">日 K</button>
            <button class="interval-btn btn btn-normal px-4 py-3" data-interval="W">週 K</button>
            <button class="interval-btn btn btn-normal px-4 py-3" data-interval="M">月 K</button>
          </div>

          <p class="text-xs text-slate-500 mt-3">
            日 K 適合短中期判斷；週 K 看波段；月 K 看大方向。
          </p>
        </div>

        <!-- Studies -->
        <div>
          <label class="block text-sm text-slate-400 font-bold mb-2">重要指標</label>

          <div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm font-bold">
            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="Volume@tv-basicstudies" checked>
              成交量
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="MASimple@tv-basicstudies" checked>
              MA 均線
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="MAExp@tv-basicstudies" checked>
              EMA 均線
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="BB@tv-basicstudies" checked>
              布林通道
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="RSI@tv-basicstudies" checked>
              RSI
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="MACD@tv-basicstudies" checked>
              MACD
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="StochasticRSI@tv-basicstudies">
              隨機 RSI
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="VWAP@tv-basicstudies">
              VWAP
            </label>

            <label class="study-card">
              <input type="checkbox" class="study-toggle" value="ATR@tv-basicstudies">
              ATR
            </label>
          </div>

          <p class="text-xs text-slate-500 mt-3">
            指標勾選後按「重新載入圖表」才會套用。
          </p>
        </div>
      </div>
    </section>

    <!-- Chart -->
    <section class="glass rounded-3xl overflow-hidden">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 p-4 border-b border-slate-700/70">
        <div>
          <div class="text-xs text-slate-500 font-bold">目前圖表</div>
          <div id="current-chart-label" class="text-xl font-black text-white">TWSE:2330 · 日 K</div>
        </div>

        <div class="flex flex-wrap gap-2 text-xs font-bold">
          <span class="px-3 py-1 rounded-full bg-blue-500/10 border border-blue-400/30 text-blue-300">
            外部報價
          </span>
          <span class="px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-400/30 text-emerald-300">
            技術指標
          </span>
          <span class="px-3 py-1 rounded-full bg-amber-500/10 border border-amber-400/30 text-amber-300">
            畫線工具
          </span>
        </div>
      </div>

      <div id="tv-chart-wrap" class="relative">
        <div id="tradingview-widget-root" class="w-full h-full"></div>
      </div>
    </section>

    <!-- Notice -->
    <section class="mt-4 text-xs text-slate-500 leading-relaxed">
      <p>
        免責聲明：本網站僅供 K 線閱讀練習與教育用途，不提供任何投資建議，也不構成買賣推薦。
        外部圖表資料、延遲狀態與可用商品以圖表服務商實際提供為準。
      </p>
    </section>

  </main>

  <script>
    const LiveChart = {
      symbol: "TWSE:2330",
      interval: "D"
    };

    function $(id) {
      return document.getElementById(id);
    }

    function intervalName(value) {
      if (value === "D") return "日 K";
      if (value === "W") return "週 K";
      if (value === "M") return "月 K";
      return value;
    }

    function getSelectedStudies() {
      return Array.from(document.querySelectorAll(".study-toggle"))
        .filter(input => input.checked)
        .map(input => input.value);
    }

    function updateButtonStyle() {
      document.querySelectorAll(".interval-btn").forEach(btn => {
        const active = btn.dataset.interval === LiveChart.interval;
        btn.className = active
          ? "interval-btn btn btn-active px-4 py-3"
          : "interval-btn btn btn-normal px-4 py-3";
      });

      document.querySelectorAll(".symbol-btn").forEach(btn => {
        const active = btn.dataset.symbol === LiveChart.symbol;
        btn.className = active
          ? "symbol-btn btn btn-active px-3 py-2 text-sm"
          : "symbol-btn btn btn-normal px-3 py-2 text-sm";
      });

      $("current-chart-label").innerText = `${LiveChart.symbol} · ${intervalName(LiveChart.interval)}`;
    }

    function renderTradingViewWidget() {
      updateButtonStyle();

      const root = $("tradingview-widget-root");
      root.innerHTML = "";

      const container = document.createElement("div");
      container.className = "tradingview-widget-container";
      container.style.height = "100%";
      container.style.width = "100%";

      const widget = document.createElement("div");
      widget.className = "tradingview-widget-container__widget";
      widget.style.height = "calc(100% - 32px)";
      widget.style.width = "100%";

      const copyright = document.createElement("div");
      copyright.className = "tradingview-widget-copyright";
      copyright.innerHTML = `
        <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">
          <span class="blue-text">Chart</span>
        </a>
        <span class="text-slate-500"> by TradingView</span>
      `;

      const script = document.createElement("script");
      script.type = "text/javascript";
      script.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
      script.async = true;

      script.innerHTML = JSON.stringify({
        autosize: true,
        symbol: LiveChart.symbol,
        interval: LiveChart.interval,
        timezone: "Asia/Taipei",
        theme: "dark",
        style: "1",
        locale: "zh_TW",
        backgroundColor: "rgba(2, 6, 23, 1)",
        gridColor: "rgba(51, 65, 85, 0.35)",
        hide_top_toolbar: false,
        hide_side_toolbar: false,
        hide_legend: false,
        hide_volume: false,
        allow_symbol_change: true,
        save_image: true,
        calendar: false,
        details: true,
        hotlist: false,
        withdateranges: true,
        studies: getSelectedStudies(),
        support_host: "https://www.tradingview.com"
      }, null, 2);

      container.appendChild(widget);
      container.appendChild(copyright);
      container.appendChild(script);
      root.appendChild(container);
    }

    function applySymbol() {
      const value = $("symbol-input").value.trim();

      if (!value) {
        alert("請輸入股票或商品代號，例如 TWSE:2330");
        return;
      }

      LiveChart.symbol = value.toUpperCase();
      renderTradingViewWidget();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll(".symbol-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          LiveChart.symbol = btn.dataset.symbol;
          $("symbol-input").value = LiveChart.symbol;
          renderTradingViewWidget();
        });
      });

      document.querySelectorAll(".interval-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          LiveChart.interval = btn.dataset.interval;
          renderTradingViewWidget();
        });
      });

      $("apply-symbol").addEventListener("click", applySymbol);

      $("symbol-input").addEventListener("keydown", event => {
        if (event.key === "Enter") {
          applySymbol();
        }
      });

      $("reload-chart").addEventListener("click", renderTradingViewWidget);

      renderTradingViewWidget();
    });
  </script>
</body>
</html>
